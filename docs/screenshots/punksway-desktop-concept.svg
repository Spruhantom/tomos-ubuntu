    <text x="82" y="438" font-size="72" font-weight="800" letter-spacing="-2">PUNK<tspan fill="#00d9ff">SWAY</tspan></text>
    <text x="92" y="478" font-size="20" fill="#c7c2e8">26.10  /  TOM OS CONCEPT DESKTOP</text>
  </g>
