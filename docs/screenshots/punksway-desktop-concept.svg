      <g transform="translate(621 815)"><rect width="48" height="43" rx="12" fill="#00d9ff" fill-opacity=".14"/><text x="24" y="29" fill="#9af2ff">⌘</text></g>
      <g transform="translate(694 815)"><rect width="48" height="43" rx="12" fill="#8d40ff" fill-opacity=".2"/><text x="24" y="29" fill="#d4baff">▸_</text></g>
      <g transform="translate(767 815)"><rect width="48" height="43" rx="12" fill="#00d9ff" fill-opacity=".14"/><text x="24" y="29" fill="#9af2ff">⚙</text></g>
