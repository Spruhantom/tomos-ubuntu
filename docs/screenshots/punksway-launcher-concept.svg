<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">PunkSway app launcher concept render</title>
  <desc id="desc">Illustrative PunkSway desktop with a translucent Wofi-style application launcher over a blue-violet neon wallpaper. Concept artwork, not a captured screenshot.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d20"/><stop offset=".55" stop-color="#211044"/><stop offset="1" stop-color="#042638"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17182b" stop-opacity=".97"/><stop offset="1" stop-color="#0b1021" stop-opacity=".96"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="65"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#wall)"/>
  <circle cx="210" cy="260" r="300" fill="#00d9ff" opacity=".45" filter="url(#blur)"/>
  <circle cx="1230" cy="600" r="330" fill="#782cff" opacity=".55" filter="url(#blur)"/>
  <path d="M0 680 L250 470 420 590 680 320 900 540 1110 300 1440 580 V900 H0Z" fill="#0a1328" opacity=".9"/>
  <path d="M0 790 L290 570 450 680 700 440 940 650 1170 430 1440 700 V900 H0Z" fill="#00d9ff" opacity=".14"/>
  <rect x="28" y="22" width="1384" height="46" rx="15" fill="#111426" fill-opacity=".88" stroke="#7664a8" stroke-opacity=".45"/>
  <text x="54" y="51" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#f5f2ff">◉  Tom OS</text>
  <text x="1180" y="50" font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#dcd8f0">◖ Audio   ▣ Battery 100%</text>
  <text x="1365" y="50" font-family="Inter,Segoe UI,sans-serif" font-size="15" text-anchor="end" fill="#00d9ff">19:28</text>
  <g filter="url(#shadow)">
    <rect x="390" y="160" width="660" height="590" rx="26" fill="url(#panel)" stroke="#00d9ff" stroke-opacity=".55" stroke-width="1.5"/>
    <text x="438" y="216" font-family="Inter,Segoe UI,sans-serif" font-size="15" letter-spacing="4" fill="#00d9ff">APPLICATIONS</text>
    <text x="438" y="260" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700" fill="#f5f2ff">What would you like to do?</text>
    <rect x="430" y="286" width="580" height="56" rx="13" fill="#080d1c" stroke="#00d9ff" stroke-opacity=".7"/>
    <circle cx="456" cy="314" r="8" fill="none" stroke="#00d9ff" stroke-width="2"/>
    <path d="M462 320 l7 7" stroke="#00d9ff" stroke-width="2"/>
    <text x="486" y="321" font-family="Inter,Segoe UI,sans-serif" font-size="17" fill="#9c9ab8">Search apps...</text>
    <g font-family="Inter,Segoe UI,sans-serif">
      <rect x="430" y="365" width="580" height="63" rx="12" fill="#00d9ff" fill-opacity=".13" stroke="#00d9ff" stroke-opacity=".55"/>
      <rect x="448" y="379" width="36" height="36" rx="10" fill="#00d9ff" fill-opacity=".2"/><text x="466" y="404" text-anchor="middle" font-size="22" fill="#7eefff">▸_</text>
      <text x="504" y="390" font-size="16" font-weight="600" fill="#f5f2ff">Foot Terminal</text><text x="504" y="411" font-size="13" fill="#a8a4c7">Open a terminal</text>
      <rect x="448" y="444" width="36" height="36" rx="10" fill="#8d40ff" fill-opacity=".2"/><text x="466" y="469" text-anchor="middle" font-size="22" fill="#d9c5ff">▣</text>
      <text x="504" y="455" font-size="16" font-weight="600" fill="#f5f2ff">Files</text><text x="504" y="476" font-size="13" fill="#a8a4c7">Browse your files</text>
      <rect x="448" y="509" width="36" height="36" rx="10" fill="#00d9ff" fill-opacity=".14"/><text x="466" y="534" text-anchor="middle" font-size="22" fill="#7eefff">⚙</text>
      <text x="504" y="520" font-size="16" font-weight="600" fill="#f5f2ff">Settings</text><text x="504" y="541" font-size="13" fill="#a8a4c7">System and desktop options</text>
      <rect x="448" y="574" width="36" height="36" rx="10" fill="#8d40ff" fill-opacity=".2"/><text x="466" y="599" text-anchor="middle" font-size="22" fill="#d9c5ff">☎</text>
      <text x="504" y="585" font-size="16" font-weight="600" fill="#f5f2ff">Tomphone</text><text x="504" y="606" font-size="13" fill="#a8a4c7">SIP audio calling</text>
      <rect x="448" y="639" width="36" height="36" rx="10" fill="#00d9ff" fill-opacity=".14"/><text x="466" y="664" text-anchor="middle" font-size="22" fill="#7eefff">◇</text>
      <text x="504" y="650" font-size="16" font-weight="600" fill="#f5f2ff">Web Browser</text><text x="504" y="671" font-size="13" fill="#a8a4c7">Shown as a launcher concept</text>
    </g>
  </g>
  <text x="1410" y="886" text-anchor="end" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#c8c3e4" opacity=".8">CONCEPT RENDER • NOT A LIVE SCREENSHOT</text>
</svg>