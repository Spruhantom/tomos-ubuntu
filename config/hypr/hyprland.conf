# PunkSway / Caelestia — experimental Hyprland session
# Based on the project's blue-neon theme. Verify options against the installed
# Hyprland version before using this on a physical machine.
$mod = SUPER
$terminal = foot
$menu = caelestia shell drawers toggle launcher

monitor = , preferred, auto, 1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = /usr/local/bin/punksway-polkit-agent
exec-once = swayidle -w timeout 300 'swaylock -f -c 050914' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'swaylock -f -c 050914'
exec-once = caelestia shell -d

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(00e5ffff) rgba(7b61ffff) 45deg
    col.inactive_border = rgba(183450aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00e5ff33)
    }
    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

animations {
    enabled = yes
    bezier = punk, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, punk, popin 85%
    animation = windowsOut, 1, 4, punk, popin 85%
    animation = border, 1, 5, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, punk, slide
}

input {
    kb_layout = gb
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

$mainMod = SUPER
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, M, exit
bind = $mainMod, D, exec, caelestia shell drawers toggle launcher
bind = $mainMod, SPACE, exec, caelestia shell drawers toggle launcher
bind = $mainMod, L, exec, swaylock -f -c 050914
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , Print, exec, sh -lc 'mkdir -p "$HOME/Pictures"; grim -g "$(slurp)" "$HOME/Pictures/punksway-$(date +%Y%m%d-%H%M%S).png"'

# Keep the custom wallpaper in both compositor sessions.
exec-once = swaybg -i /usr/share/backgrounds/punksway/neon-punk.png -m fill
